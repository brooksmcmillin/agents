# Loki Configuration for Agent Framework
# Documentation: https://grafana.com/docs/loki/latest/configuration/

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

# Query scheduling
query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

# Schema configuration - TSDB storage
schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# Ruler configuration (for alerting)
ruler:
  alertmanager_url: http://localhost:9093

# Ingestion limits
limits_config:
  # Ingestion rate limit (8MB/s)
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16

  # Per-stream rate limits
  per_stream_rate_limit: 3MB
  per_stream_rate_limit_burst: 15MB

  # Query limits
  max_query_parallelism: 32
  max_query_series: 5000

  # Retention
  retention_period: 168h  # 7 days

# Compactor configuration
compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
  delete_request_store: filesystem

# Analytics disabled
analytics:
  reporting_enabled: false
