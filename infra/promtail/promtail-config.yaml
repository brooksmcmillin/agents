# Promtail Configuration for Agent Framework
# Documentation: https://grafana.com/docs/loki/latest/send-data/promtail/configuration/

server:
  http_listen_port: 9080
  grpc_listen_port: 0

# Positions file to track where Promtail has read in each log file
positions:
  filename: /tmp/positions.yaml

# Loki server to send logs to
clients:
  - url: http://loki:3100/loki/api/v1/push
    batchwait: 1s
    batchsize: 1048576  # 1MB
    timeout: 10s

scrape_configs:
  # Scrape agent log files (JSON format)
  - job_name: agent_logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: agents
          __path__: /var/log/agents/*.log

    # Pipeline stages for JSON log parsing
    pipeline_stages:
      # Parse JSON log entries
      - json:
          expressions:
            level: level
            agent_name: agent_name
            correlation_id: correlation_id
            conversation_id: conversation_id
            tool_name: tool_name
            message: message
            timestamp: timestamp
            logger: logger
            module: module
            function: function
            line: line

      # Extract labels from parsed JSON (with defaults)
      - labels:
          level:
          agent_name:
          logger:

      # Set timestamp from log entry
      - timestamp:
          source: timestamp
          format: RFC3339Nano
          fallback_formats:
            - RFC3339

      # Keep original message as log line
      - output:
          source: message

  # Scrape MCP tool invocation logs (JSONL format)
  - job_name: mcp_tool_logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: mcp_tools
          __path__: /var/log/mcp-tools/*.jsonl

    pipeline_stages:
      - json:
          expressions:
            tool_name: tool_name
            success: success
            error_type: error_type
            duration_ms: duration_ms
            timestamp: timestamp

      - labels:
          tool_name:
          success:

      - timestamp:
          source: timestamp
          format: RFC3339Nano
          fallback_formats:
            - RFC3339

  # Scrape Docker container logs (for stdout/stderr)
  - job_name: docker_containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Only scrape containers with agents- prefix
      - source_labels: ['__meta_docker_container_name']
        regex: '/(agents-.*)'
        action: keep
      # Extract container name as label
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      # Extract service name from container name
      - source_labels: ['__meta_docker_container_name']
        regex: '/agents-(.*)'
        target_label: service
      # Add job label
      - replacement: docker
        target_label: job

    pipeline_stages:
      # Try to detect and parse JSON logs
      - match:
          selector: '{job="docker"}'
          stages:
            # First try JSON parsing
            - json:
                expressions:
                  level: level
                  agent_name: agent_name
                  correlation_id: correlation_id
                  message: message
            # Set labels if JSON parsing succeeded
            - labels:
                level:
                agent_name:
            # Output message field if present
            - output:
                source: message
      # For non-JSON logs, keep the raw line (default behavior)
