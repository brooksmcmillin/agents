name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: uv sync

      - name: Ruff check
        run: uv run ruff check . --output-format=github

      - name: Ruff format check
        run: uv run ruff format --check .

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: webui/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: webui/frontend
        run: npm ci

      - name: ESLint
        working-directory: webui/frontend
        run: npm run lint

      - name: TypeScript check
        working-directory: webui/frontend
        run: npx tsc --noEmit

  pip-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: uv sync

      - name: Audit production dependencies
        run: |
          uv export --format requirements-txt --no-dev \
            | grep -vE '^-e |agent-framework' > /tmp/reqs.txt
          uv run --with 'pip-audit>=2.10,<3' pip-audit -r /tmp/reqs.txt

  unit-tests:
    name: Unit Tests (${{ matrix.python-version }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - run: uv sync

      - name: Run unit tests
        env:
          RATE_LIMIT_ENABLED: "false"
        run: |
          uv run pytest tests/unit/ -v
          uv run pytest packages/agent-framework/tests/ -v \
            --ignore=packages/agent-framework/tests/test_conversation_store.py \
            --ignore=packages/agent-framework/tests/test_database_memory_store.py

  database-tests:
    name: Database Tests (${{ matrix.python-version }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_agents
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - run: uv sync

      - name: Run database tests
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_agents
          RATE_LIMIT_ENABLED: "false"
        run: |
          uv run pytest packages/agent-framework/tests/test_conversation_store.py -v
          uv run pytest packages/agent-framework/tests/test_database_memory_store.py -v
          uv run pytest tests/integration/test_api_conversations.py -v

  eval-validation:
    name: Eval Dataset Validation
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: uv sync

      - name: Validate eval datasets and coverage
        run: uv run pytest tests/evaluations/test_evaluations.py -v

  prompt-change-gate:
    name: Prompt Change Gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: uv sync

      - name: Check eval baselines for prompt changes
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: >
          uv run python -m tests.evaluations.check_prompt_gate
          origin/$BASE_REF

  frontend-tests:
    name: Frontend Tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: webui/frontend/package-lock.json

      - name: Install dependencies
        working-directory: webui/frontend
        run: npm ci

      - name: Run tests
        working-directory: webui/frontend
        run: npm test -- --run --coverage

  frontend-build:
    name: Frontend Build
    needs: frontend-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: webui/frontend/package-lock.json

      - name: Install dependencies
        working-directory: webui/frontend
        run: npm ci

      - name: Build
        working-directory: webui/frontend
        run: npm run build

      - name: Verify build output
        run: |
          test -f webui/dist/index.html || exit 1
          test -d webui/dist/assets || exit 1

      - uses: actions/upload-artifact@v6
        with:
          name: frontend-build
          path: webui/dist/
          retention-days: 7

  integration-tests:
    name: Integration Tests
    needs: [pip-audit, unit-tests, database-tests, frontend-build]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agents_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: uv sync

      - uses: actions/download-artifact@v7
        with:
          name: frontend-build
          path: webui/dist/

      - name: Start API server
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agents_test
          DEV_MODE: "true"
          DISABLE_AUTH: "true"
          ENV: development
        run: |
          uv run python -m api &
          echo $! > api.pid
          sleep 5

      - name: Check API health
        run: curl -f http://localhost:8080/health

      - name: Test API endpoints
        run: |
          curl -f http://localhost:8080/agents | jq '.agents | length'
          CONV_ID=$(curl -f -X POST http://localhost:8080/conversations \
            -H "Content-Type: application/json" \
            -d '{"agent":"chatbot","title":"Test"}' | jq -r '.id')
          curl -f http://localhost:8080/conversations/$CONV_ID

      - name: Stop API server
        if: always()
        run: |
          if [ -f api.pid ]; then kill $(cat api.pid) || true; fi
