name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: brooksmcmillin/workflows/.github/workflows/python-ci.yml@main
    with:
      package-name: agents
      python-versions: '["3.12", "3.13"]'
      run-build: false
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      GH_PAT: ${{ secrets.GH_PAT }}

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Run unit tests (tests/unit/)
        env:
          RATE_LIMIT_ENABLED: "false"
        run: |
          uv run pytest tests/unit/ -v

      - name: Run agent-framework unit tests
        env:
          RATE_LIMIT_ENABLED: "false"
        run: |
          uv run pytest packages/agent-framework/tests/ -v \
            --ignore=packages/agent-framework/tests/test_conversation_store.py \
            --ignore=packages/agent-framework/tests/test_database_memory_store.py
