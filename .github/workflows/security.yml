name: Security

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: write
  security-events: write

jobs:
  security:
    uses: brooksmcmillin/workflows/.github/workflows/python-security.yml@main
    with:
      package-name: agents
      allowed-licenses: 'MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, Python-2.0, Unicode-3.0, Zlib, MPL-2.0'
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}
