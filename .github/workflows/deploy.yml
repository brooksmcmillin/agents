name: Deploy

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-publish:
    name: Build and Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync

      - name: Run unit tests
        run: uv run pytest tests/unit/ packages/agent-framework/tests/ -v --ignore=packages/agent-framework/tests/test_conversation_store.py --ignore=packages/agent-framework/tests/test_database_memory_store.py

      - name: Create release archive
        run: |
          tar -czf agents-${{ github.ref_name }}.tar.gz \
            agents/ packages/ shared/ api/ mcp_server/ bin/ deploy/ \
            pyproject.toml uv.lock README.md CLAUDE.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: agents-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
