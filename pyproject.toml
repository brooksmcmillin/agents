[project]
name = "agents"
version = "0.1.0"
description = "Multi-agent system built with Claude and Model Context Protocol (MCP)"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.97.0",
    "mcp>=1.27.0",  # Updated from ==1.10.1 to fix CVE-2025-66416 (DNS rebinding)
    "httpx>=0.27.0",
    "aiohttp>=3.13.3",  # Updated from >=3.11.0 to fix 8 CVEs (DoS, request smuggling)
    "starlette>=0.41.0",
    "uvicorn>=0.32.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.6.0",
    "authlib>=1.6.11",
    "cryptography>=44.0.0",
    "python-json-logger>=2.0.7",
    "beautifulsoup4>=4.14.3",
    "lxml>=6.1.0",
    "markdownify>=1.2.0",
    "agent-framework",
    "fastapi>=0.115.0",
    "slowapi>=0.1.9",
    "markdown>=3.10.1",
    "pypdf>=6.10.2",  # Updated from >=6.7.4 to fix CVE-2026-28804
]

[tool.uv]
# Single source of truth for minimum dependency versions across the workspace.
# uv enforces these during resolution so root and agent-framework stay in sync.
constraint-dependencies = [
    "anthropic>=0.97.0",
    "mcp>=1.27.0",
    "httpx>=0.27.0",
    "aiohttp>=3.13.3",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "cryptography>=44.0.0",
    "beautifulsoup4>=4.14.3",
    "markdownify>=1.2.0",
    "lxml>=6.1.0",
]

[tool.uv.sources]
agent-framework = { path = "packages/agent-framework", editable = true }

[dependency-groups]
browser = [
    "agent-framework[browser]",
]
dev = [
    "pip-audit>=2.10.0",
    "pre-commit>=4.5.1",
    "pyright>=1.1.408",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=7.0.0",
    "pytest-testmon>=2.2.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.10",
    "safety>=3.7.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--import-mode=importlib --cov --cov-report=term-missing"
testpaths = [
    "tests",
    "packages/agent-framework/tests",
    "api"
]

[tool.coverage.run]
branch = true
source = [
    "agents",
    "api",
    "mcp_server",
    "shared",
    "packages/agent-framework/agent_framework",
]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/conftest.py",
    "bin/*",
    "scripts/*",
]

[tool.coverage.report]
precision = 2
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

# Pyright configuration moved to pyrightconfig.json

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__.py

[tool.bandit]
exclude_dirs = ["tests", "scripts/deployment"]
skips = ["B101", "B608"]  # B101: asserts in tests/type narrowing; B608: false positives on prompt strings containing "SQL"
