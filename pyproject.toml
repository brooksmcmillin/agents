[project]
name = "agents"
version = "0.1.0"
description = "Multi-agent system built with Claude and Model Context Protocol (MCP)"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.104.1",
    "mcp>=1.27.1",  # Updated from ==1.10.1 to fix CVE-2025-66416 (DNS rebinding)
    "httpx>=0.28.1",
    "aiohttp>=3.14.0",  # Updated from >=3.11.0 to fix CVEs; >=3.14.0 fixes CVE-2026-34993, CVE-2026-47265
    "starlette>=1.2.1",
    "uvicorn>=0.48.0",
    "python-dotenv>=1.2.2",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.14.1",
    "authlib>=1.7.2",
    "cryptography>=48.0.0",  # Updated from >=44.0.0 to fix CVE-2026-39892 (buffer overflow)
    "python-json-logger>=4.1.0",
    "beautifulsoup4>=4.14.3",
    "lxml>=6.1.1",
    "markdownify>=1.2.2",
    "agent-framework",
    "fastapi>=0.136.3",
    "slowapi>=0.1.9",
    "markdown>=3.10.2",
    "pypdf>=6.12.2",  # Updated from >=6.7.4 to fix CVE-2026-28804
]

[tool.uv]
# Single source of truth for minimum dependency versions across the workspace.
# uv enforces these during resolution so root and agent-framework stay in sync.
constraint-dependencies = [
    "anthropic>=0.104.1",
    "mcp>=1.27.1",
    "httpx>=0.28.1",
    "aiohttp>=3.14.0",
    "pyjwt>=2.13.0",  # Transitive via mcp; floor fixes PYSEC-2026-175/176/177/178/179
    "pydantic>=2.12.5",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "cryptography>=48.0.0",
    "beautifulsoup4>=4.14.3",
    "markdownify>=1.2.2",
    "lxml>=6.1.1",
    "python-multipart>=0.0.27",  # Transitive via mcp; floor fixes CVE-2026-40347 (DoS)
]
# litellm>=1.83.7,<1.83.14 pins python-dotenv==1.0.1 and litellm==1.83.14 pins
# aiohttp==3.13.4 — both conflict with our security floors. override-dependencies
# replaces those transitive pins so the resolver can find a valid solution.
override-dependencies = [
    "aiohttp>=3.14.0",
    "python-dotenv>=1.2.2",
]

[tool.uv.sources]
agent-framework = { path = "packages/agent-framework", editable = true }

[dependency-groups]
browser = [
    "agent-framework[browser]",
]
dev = [
    "pip-audit>=2.10.0",
    "pre-commit>=4.6.0",
    "pyright>=1.1.410",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-testmon>=2.2.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.16",
    "safety>=3.8.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--import-mode=importlib --cov --cov-report=term-missing"
testpaths = [
    "tests",
    "packages/agent-framework/tests",
    "api"
]

[tool.coverage.run]
branch = true
source = [
    "agents",
    "api",
    "mcp_server",
    "shared",
    "packages/agent-framework/agent_framework",
]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/conftest.py",
    "bin/*",
    "scripts/*",
]

[tool.coverage.report]
precision = 2
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

# Pyright configuration moved to pyrightconfig.json

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__.py

[tool.bandit]
exclude_dirs = ["tests", "scripts/deployment"]
skips = ["B101", "B608"]  # B101: asserts in tests/type narrowing; B608: false positives on prompt strings containing "SQL"
