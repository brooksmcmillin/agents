[package]
name = "remote-agent"
version = "0.1.0"
edition = "2021"
description = "Remote shell agent that communicates via MCP relay channels"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
hostname = "0.4"
