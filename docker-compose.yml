version: '3.8'

services:
  # Backend API service (FastAPI + Python)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agents-backend
    environment:
      # Database connection (required - set in .env file)
      DATABASE_URL: ${DATABASE_URL}

      # Required: Add your Anthropic API key
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}

      # Memory backend configuration
      MEMORY_BACKEND: database

      # Logging - enable Loki-compatible JSON format
      LOG_LEVEL: INFO
      LOKI_ENABLED: "true"
      LOG_FORMAT: json
      LOG_DIR: /var/log/mcp-tools

      # Optional: Add other environment variables as needed
      # MCP_SERVER_URL: ${MCP_SERVER_URL:-}
      # SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      # GITHUB_MCP_PAT: ${GITHUB_MCP_PAT:-}
    volumes:
      # Mount source code for development (optional - comment out for production)
      - .:/app
      # Exclude venv and pycache so container doesn't overwrite host copies
      - /app/.venv
      - /app/__pycache__
      # Persist memories (if using file backend)
      - ./memories:/app/memories
      # Tool invocation logs
      - mcp_tool_logs:/var/log/mcp-tools
    ports:
      - "8080:8080"
    networks:
      - agents-network
    restart: unless-stopped
    command: uv run python -m api

networks:
  agents-network:
    driver: bridge

volumes:
  mcp_tool_logs:
    driver: local
