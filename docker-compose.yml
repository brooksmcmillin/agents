version: '3.8'

services:
  # Backend API service (FastAPI + Python)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agents-backend
    environment:
      # Database connection (required - set in .env file)
      DATABASE_URL: ${DATABASE_URL}

      # Required: Add your Anthropic API key
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}

      # Memory backend configuration
      MEMORY_BACKEND: database

      # Logging - enable Loki-compatible JSON format
      LOG_LEVEL: INFO
      LOKI_ENABLED: "true"
      LOG_FORMAT: json
      LOG_DIR: /var/log/agents

      # Optional: Add other environment variables as needed
      # MCP_SERVER_URL: ${MCP_SERVER_URL:-}
      # SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      # GITHUB_MCP_PAT: ${GITHUB_MCP_PAT:-}
    volumes:
      # Mount source code for development (optional - comment out for production)
      - .:/app
      # Exclude venv and pycache so container doesn't overwrite host copies
      - /app/.venv
      - /app/__pycache__
      # Persist logs (shared with Promtail for log scraping)
      - agent_logs:/var/log/agents
      # Persist memories (if using file backend)
      - ./memories:/app/memories
    ports:
      - "8080:8080"
    extra_hosts:
      # Direct IP bypass for Cloudflare (allows direct database access)
      - "todo.brooksmcmillin.com:172.236.250.226"
    networks:
      - agents-network
    restart: unless-stopped
    depends_on:
      - loki
    command: uv run python -m api

  # Frontend build and serve (production mode)
  # For development, run "npm run dev" locally instead
  frontend:
    build:
      context: ./webui/frontend
      dockerfile: Dockerfile
    container_name: agents-frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    volumes:
      # Copy built assets to backend's static directory
      - frontend_dist:/app/dist
    networks:
      - agents-network

  # ---------------------------------------------------------------------------
  # Observability Stack (Grafana Loki)
  # ---------------------------------------------------------------------------

  # Loki - Log aggregation system
  loki:
    image: grafana/loki:3.0.0
    container_name: agents-loki
    ports:
      - "3100:3100"
    volumes:
      - ./infra/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - agents-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Promtail - Log shipping agent
  promtail:
    image: grafana/promtail:3.0.0
    container_name: agents-promtail
    volumes:
      - ./infra/promtail/promtail-config.yaml:/etc/promtail/config.yaml:ro
      - agent_logs:/var/log/agents:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yaml
    networks:
      - agents-network
    depends_on:
      loki:
        condition: service_healthy
    restart: unless-stopped

  # Grafana - Visualization and dashboards
  grafana:
    image: grafana/grafana:11.0.0
    container_name: agents-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-changeme}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
      # Disable analytics
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    volumes:
      - ./infra/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infra/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infra/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - agents-network
    depends_on:
      loki:
        condition: service_healthy
    restart: unless-stopped

networks:
  agents-network:
    driver: bridge

volumes:
  frontend_dist:
    driver: local
  loki_data:
    driver: local
  grafana_data:
    driver: local
  agent_logs:
    driver: local
